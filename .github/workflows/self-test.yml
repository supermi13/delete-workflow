name: Self test (dry-run)

# Manual smoke test: exercises all three forms (delete action, sync action,
# CLI) against the current repository only. Read-only — dry-run can never
# delete or sync anything.

on:
  workflow_dispatch:

permissions: {}

jobs:
  action-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run delete action (dry-run)
        uses: ./
        with:
          token: ${{ github.token }}
          repositories: ${{ github.repository }}
          dry_run: "true"

  sync-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync-forks action (dry-run, current repo is not a fork → skipped)
        uses: ./sync-forks
        with:
          token: ${{ github.token }}
          repositories: ${{ github.repository }}
          dry_run: "true"

  cli-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run delete CLI (dry-run)
        run: |
          node index.js \
            --token "${{ github.token }}" \
            --repositories "${{ github.repository }}" \
            --retain-days 30 \
            --keep-minimum-runs 1 \
            --dry-run
      - name: Run sync-forks CLI (dry-run)
        run: |
          node sync-forks.js \
            --token "${{ github.token }}" \
            --repositories "${{ github.repository }}" \
            --dry-run
