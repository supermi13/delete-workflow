name: Scheduled maintenance (cleanup + fork sync)

# Runs two maintenance tasks together on one schedule:
#   1. Delete old workflow runs in EVERY repository owned by `owner`
#   2. Sync every forked repository with its upstream ("Syncing a fork")
#
# Setup (once):
#   1. Create a classic PAT with `repo` scope (or a fine-grained PAT with
#      "Actions: Read and write" + "Contents: Read and write" on all repos) —
#      the default GITHUB_TOKEN cannot see other repositories.
#   2. Add it as a repository secret named PAT.
#   3. Adjust the `workflow_dispatch` defaults below (owner, retain_days, ...).
#
# Manual run: click "Run workflow" to open the parameter panel. Every field on
# the panel overrides the corresponding default for that single run; the daily
# scheduled run always uses the hardcoded defaults below (real deletion + sync).
# Start with `dry_run` checked to preview what would happen.
# Use `sync_forks` (manual runs only) to skip the fork-sync step entirely.

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "试运行（仅模拟，不会真的删除任何内容）"
        type: boolean
        default: true
      owner:
        description: "要处理仓库所属的账号（用户或组织）"
        type: string
        default: "supermi13"
      repositories:
        description: "要处理哪些仓库"
        type: choice
        options:
          - ALL
          - SPECIFIC
        default: ALL
      specific_repos:
        description: "指定仓库列表（仅当“仓库范围”选择 SPECIFIC 时生效），用逗号或空格分隔，格式 owner/repo"
        type: string
        default: ""
      retain_days:
        description: "删除超过 N 天的运行记录（0 = 不限制时间）"
        type: choice
        options:
          - "0"
          - "1"
          - "3"
          - "7"
          - "14"
          - "30"
        default: "1"
      keep_minimum_runs:
        description: "每个工作流至少保留最近 N 次运行记录"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "6"
          - "10"
        default: "2"
      include_private:
        description: "包含私有仓库"
        type: boolean
        default: true
      include_forks:
        description: "包含 Fork 仓库（删除步骤）"
        type: boolean
        default: true
      include_archived:
        description: "包含已归档仓库"
        type: boolean
        default: false
      delete_run_by_conclusion_pattern:
        description: "只删除符合指定结论的运行记录，例如 Success,Failure（留空 = 全部）"
        type: string
        default: ""
      sync_forks:
        description: "同步 Fork 仓库（是否执行 Fork 同步步骤）"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: delete-workflow-cleanup
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.PAT != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check PAT secret
        if: ${{ env.HAS_PAT != 'true' }}
        run: |
          echo "::error::Repository secret 'PAT' is not set. Create a classic PAT with repo scope and add it as the 'PAT' secret to clean all repositories and sync forks."
          exit 1

      - name: Delete old workflow runs in all repositories
        uses: ./
        with:
          token: ${{ secrets.PAT }}
          owner: ${{ github.event_name == 'workflow_dispatch' && inputs.owner || 'supermi13' }}
          repositories: ${{ github.event_name == 'workflow_dispatch' && (inputs.repositories == 'SPECIFIC' && inputs.specific_repos || 'ALL') || 'ALL' }}
          include_private: ${{ github.event_name == 'workflow_dispatch' && inputs.include_private && 'true' || 'false' }}
          include_forks: ${{ github.event_name == 'workflow_dispatch' && inputs.include_forks && 'true' || 'false' }}
          include_archived: ${{ github.event_name == 'workflow_dispatch' && inputs.include_archived && 'true' || 'false' }}
          retain_days: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_days || '1' }}
          keep_minimum_runs: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_minimum_runs || '2' }}
          delete_run_by_conclusion_pattern: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_run_by_conclusion_pattern || '' }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      - name: Sync all forked repositories
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_forks }}
        uses: ./sync-forks
        with:
          token: ${{ secrets.PAT }}
          owner: ${{ github.event_name == 'workflow_dispatch' && inputs.owner || 'supermi13' }}
          repositories: ${{ github.event_name == 'workflow_dispatch' && (inputs.repositories == 'SPECIFIC' && inputs.specific_repos || 'ALL') || 'ALL' }}
          include_private: ${{ github.event_name == 'workflow_dispatch' && inputs.include_private && 'true' || 'false' }}
          include_archived: ${{ github.event_name == 'workflow_dispatch' && inputs.include_archived && 'true' || 'false' }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
